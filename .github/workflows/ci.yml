name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The heavy Windows suite runs on the self-hosted runner on the development PC.
# It is deliberately Windows-native: the bridge build needs real NinjaTrader
# assemblies, which no hosted image has.
#
# Least privilege is explicit here. These jobs read the repository and nothing
# else, and no workflow in this repo references `secrets.` at all -- the runner
# never sees a Production credential or a deployment key, and there is nothing
# for a compromised step to exfiltrate beyond the source it already checked out.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: [self-hosted, windows, x64, stratforge-ci]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
        working-directory: NT-Analyzer
    steps:
      # A self-hosted runner keeps its working directory between jobs, unlike a
      # hosted image that starts clean. Without this, a file deleted in a branch
      # lingers and the suite passes against a tree that no longer exists.
      - name: Clean the persistent workspace
        run: git clean -xdf; git reset --hard
        working-directory: .
        continue-on-error: true
      - uses: actions/checkout@v7
      # The self-hosted runner is a provisioned machine, not an ephemeral
      # image, so it uses the toolchain that is already installed. The setup-*
      # actions write HKLM registry entries, which the non-admin service
      # account cannot do -- and granting it admin to satisfy an action would
      # give arbitrary repository code local administrator rights, which is the
      # opposite of why it runs unprivileged.
      - name: Verify toolchain
        run: |
          $tools = @{ python = '3.12'; node = ''; git = '' }
          foreach ($name in $tools.Keys) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "$name is not on PATH for the runner service account." }
            Write-Host "$name -> $($cmd.Source)"
          }
          $py = (python --version)
          Write-Host $py
          if ($py -notmatch '^Python 3\.12\.') { throw "Expected Python 3.12.x, got '$py'." }
          node --version
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate External GPT context pack
        run: python tools/validate_external_gpt_context.py
      - name: Run release test runner
        run: python -m tests
      - name: Run full pytest suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Validate Aurora JavaScript
        run: |
          Get-ChildItem app\static\aurora\assets -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  bridge-build-if-nt8-present:
    runs-on: [self-hosted, windows, x64, stratforge-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: NT-Analyzer
    steps:
      - name: Clean the persistent workspace
        run: git clean -xdf; git reset --hard
        working-directory: .
        continue-on-error: true
      - uses: actions/checkout@v7
      # Same reasoning as above: dotnet is installed machine-wide here.
      - name: Verify dotnet
        run: dotnet --version
      - name: Build bridge when NinjaTrader assemblies are available
        run: |
          $ntCore = "C:\Program Files\NinjaTrader 8\bin\NinjaTrader.Core.dll"
          if (Test-Path -LiteralPath $ntCore) {
            dotnet build bridge\NTAnalyzerBridge.csproj -c Debug
          } else {
            Write-Host "NinjaTrader assemblies are not installed on this runner; skipping bridge build."
          }
