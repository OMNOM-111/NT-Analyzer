name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
        working-directory: NT-Analyzer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate External GPT context pack
        run: python tools/validate_external_gpt_context.py
      - name: Run release test runner
        run: python -m tests
      - name: Run full pytest suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Validate Aurora JavaScript
        run: |
          Get-ChildItem app\static\aurora\assets -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  bridge-build-if-nt8-present:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: NT-Analyzer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build bridge when NinjaTrader assemblies are available
        run: |
          $ntCore = "C:\Program Files\NinjaTrader 8\bin\NinjaTrader.Core.dll"
          if (Test-Path -LiteralPath $ntCore) {
            dotnet build bridge\NTAnalyzerBridge.csproj -c Debug
          } else {
            Write-Host "NinjaTrader assemblies are not installed on this runner; skipping bridge build."
          }
