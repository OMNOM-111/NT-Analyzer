name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The heavy Windows suite runs on the self-hosted runner on the development PC.
# It is deliberately Windows-native: the bridge build needs real NinjaTrader
# assemblies, which no hosted image has.
#
# Least privilege is explicit here. These jobs read the repository and nothing
# else, and no workflow in this repo references `secrets.` at all -- the runner
# never sees a Production credential or a deployment key, and there is nothing
# for a compromised step to exfiltrate beyond the source it already checked out.
permissions:
  contents: read

# Shared with next-architecture-ci on purpose. Both workflows run the identical
# full pytest suite on the same single self-hosted Windows runner, and the suite
# still writes nine files under <project>/data (see tests/conftest.py). Two runs
# at once therefore performed atomic .tmp -> rename writes onto the same files;
# on Windows a rename onto a file another process holds fails with WinError 5,
# that exception escapes inside an HTTP handler thread after the response line
# is already out, and the waiting client gets WSAECONNABORTED (10053) instead of
# its status. It cost three different tests across four runs, never the same one
# twice.
#
# This is not serialisation in place of a fix. The cause was reproduced locally
# by running two suites concurrently, the test-side isolation that could be done
# safely has been done, and what remains is a measured gap the guard in conftest
# now watches. Until that gap closes, one runner may only run one suite at a
# time -- and cancel-in-progress stays false so neither required check is
# cancelled by the other queueing behind it.
concurrency:
  group: stratforge-self-hosted-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-tests:
    runs-on: [self-hosted, windows, x64, stratforge-ci]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        # Windows PowerShell, not pwsh. PowerShell 7 is installed here only as
        # a per-user MSIX package under WindowsApps, which the runner's own
        # service account cannot execute; 5.1 ships with Windows and is always
        # reachable. These steps use no 7-only syntax.
        shell: powershell
        working-directory: NT-Analyzer
    steps:
      # A self-hosted runner keeps its working directory between jobs, unlike a
      # hosted image that starts clean. Without this, a file deleted in a branch
      # lingers and the suite passes against a tree that no longer exists.
      - name: Clean the persistent workspace
        run: git clean -xdf; git reset --hard
        working-directory: .
        continue-on-error: true
      # actions/checkout is downloaded from codeload.github.com for every job.
      # A self-hosted runner has one IP for all of its runs, so a busy day
      # returns 429 and this mandatory check fails for a reason unrelated to
      # the change -- with a multi-hour back-off, so a retry does not help.
      # git is already on this machine and the workspace persists, so fetch
      # directly and keep the gate independent of that download.
      #
      # The credential goes in a per-command -c http.extraheader rather than in
      # the remote URL: .git/config survives between jobs on a persistent
      # runner, and a token written there would survive with it.
      - name: Check out (self-hosted, no marketplace download)
        if: runner.environment == 'self-hosted'
        working-directory: .
        shell: powershell
        env:
          RUNNER_GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path .git)) { git init -q . }
          $header = "AUTHORIZATION: basic " + [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:RUNNER_GH_TOKEN"))
          $url = "https://github.com/$env:GITHUB_REPOSITORY.git"
          git remote set-url origin $url
          if ($LASTEXITCODE -ne 0) { git remote add origin $url }
          git -c http.extraheader="$header" fetch --no-tags --prune --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "fetch failed" }
          git checkout -q --force --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "checkout failed" }
          git clean -xdf
          Write-Host ("checked out " + (git rev-parse HEAD))

      # The self-hosted runner is a provisioned machine, not an ephemeral
      # image, so it uses the toolchain that is already installed. The setup-*
      # actions write HKLM registry entries, which the non-admin service
      # account cannot do -- and granting it admin to satisfy an action would
      # give arbitrary repository code local administrator rights, which is the
      # opposite of why it runs unprivileged.
      - name: Verify toolchain
        run: |
          $tools = @{ python = '3.12'; node = ''; git = '' }
          foreach ($name in $tools.Keys) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "$name is not on PATH for the runner service account." }
            Write-Host "$name -> $($cmd.Source)"
          }
          $py = (python --version)
          Write-Host $py
          if ($py -notmatch '^Python 3\.12\.') { throw "Expected Python 3.12.x, got '$py'." }
          node --version
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate External GPT context pack
        run: python tools/validate_external_gpt_context.py
      - name: Run release test runner
        run: python -m tests
      - name: Run full pytest suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Validate Aurora JavaScript
        run: |
          Get-ChildItem app\static\aurora\assets -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  bridge-build-if-nt8-present:
    runs-on: [self-hosted, windows, x64, stratforge-ci]
    timeout-minutes: 20
    defaults:
      run:
        # Windows PowerShell, not pwsh. PowerShell 7 is installed here only as
        # a per-user MSIX package under WindowsApps, which the runner's own
        # service account cannot execute; 5.1 ships with Windows and is always
        # reachable. These steps use no 7-only syntax.
        shell: powershell
        working-directory: NT-Analyzer
    steps:
      - name: Clean the persistent workspace
        run: git clean -xdf; git reset --hard
        working-directory: .
        continue-on-error: true
      # actions/checkout is downloaded from codeload.github.com for every job.
      # A self-hosted runner has one IP for all of its runs, so a busy day
      # returns 429 and this mandatory check fails for a reason unrelated to
      # the change -- with a multi-hour back-off, so a retry does not help.
      # git is already on this machine and the workspace persists, so fetch
      # directly and keep the gate independent of that download.
      #
      # The credential goes in a per-command -c http.extraheader rather than in
      # the remote URL: .git/config survives between jobs on a persistent
      # runner, and a token written there would survive with it.
      - name: Check out (self-hosted, no marketplace download)
        if: runner.environment == 'self-hosted'
        working-directory: .
        shell: powershell
        env:
          RUNNER_GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path .git)) { git init -q . }
          $header = "AUTHORIZATION: basic " + [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:RUNNER_GH_TOKEN"))
          $url = "https://github.com/$env:GITHUB_REPOSITORY.git"
          git remote set-url origin $url
          if ($LASTEXITCODE -ne 0) { git remote add origin $url }
          git -c http.extraheader="$header" fetch --no-tags --prune --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "fetch failed" }
          git checkout -q --force --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "checkout failed" }
          git clean -xdf
          Write-Host ("checked out " + (git rev-parse HEAD))

      # Same reasoning as above: dotnet is installed machine-wide here.
      - name: Verify dotnet
        run: dotnet --version
      - name: Build bridge when NinjaTrader assemblies are available
        run: |
          $ntCore = "C:\Program Files\NinjaTrader 8\bin\NinjaTrader.Core.dll"
          if (Test-Path -LiteralPath $ntCore) {
            dotnet build bridge\NTAnalyzerBridge.csproj -c Debug
          } else {
            Write-Host "NinjaTrader assemblies are not installed on this runner; skipping bridge build."
          }
