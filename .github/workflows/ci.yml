name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
        working-directory: NT-Analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m tests

  bridge-build-if-nt8-present:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: NT-Analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build bridge when NinjaTrader assemblies are available
        run: |
          $ntCore = "C:\Program Files\NinjaTrader 8\bin\NinjaTrader.Core.dll"
          if (Test-Path -LiteralPath $ntCore) {
            dotnet build bridge\NTAnalyzerBridge.csproj -c Debug
          } else {
            Write-Host "NinjaTrader assemblies are not installed on this runner; skipping bridge build."
          }
