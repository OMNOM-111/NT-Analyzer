name: Next Architecture CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: NT-Analyzer

jobs:
  static-gates:
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: NT-Analyzer/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python tools/release_static_scan.py --scan all
      - run: python tools/validate_external_gpt_context.py
      - run: python -m compileall -q app tools

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: NT-Analyzer/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -B -m pytest -q -p no:cacheprovider
