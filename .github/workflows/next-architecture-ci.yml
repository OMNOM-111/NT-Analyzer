name: Next Architecture CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: NT-Analyzer

jobs:
  static-gates:
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: NT-Analyzer/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python tools/release_static_scan.py --scan all
      - run: python tools/validate_external_gpt_context.py
      - run: python -m compileall -q app tools

  tests:
    # The Windows leg runs the same full suite as ci.yml's python-tests, so it
    # belongs on the self-hosted runner rather than burning billed minutes to
    # repeat it. The Linux leg stays hosted: it is the only cross-platform
    # coverage there is, and the runner is Windows.
    name: Tests (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            runner: ubuntu-latest
          - label: windows-self-hosted
            runner: [self-hosted, windows, x64, stratforge-ci]
    runs-on: ${{ matrix.runner }}
    # The Windows leg runs the same full suite as ci.yml and needs the same
    # budget; see the measurement recorded there. The hosted Linux leg finishes
    # in about 17 minutes and is unaffected by the higher cap.
    timeout-minutes: 120
    steps:
      # A self-hosted workspace persists between jobs; a hosted image does not.
      # Without this a file deleted on a branch lingers and the suite passes
      # against a tree that no longer exists.
      - name: Clean the persistent workspace
        if: runner.environment == 'self-hosted'
        working-directory: .
        run: git clean -xdf; git reset --hard
        continue-on-error: true
      # actions/checkout is downloaded from codeload.github.com for every job.
      # A self-hosted runner has one IP for all of its runs, so a busy day
      # returns 429 and this mandatory check fails for a reason unrelated to
      # the change -- with a multi-hour back-off, so a retry does not help.
      # git is already on this machine and the workspace persists, so fetch
      # directly and keep the gate independent of that download.
      #
      # The credential goes in a per-command -c http.extraheader rather than in
      # the remote URL: .git/config survives between jobs on a persistent
      # runner, and a token written there would survive with it.
      - name: Check out (self-hosted, no marketplace download)
        if: runner.environment == 'self-hosted'
        working-directory: .
        shell: powershell
        env:
          RUNNER_GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path .git)) { git init -q . }
          $header = "AUTHORIZATION: basic " + [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:RUNNER_GH_TOKEN"))
          $url = "https://github.com/$env:GITHUB_REPOSITORY.git"
          git remote set-url origin $url
          if ($LASTEXITCODE -ne 0) { git remote add origin $url }
          git -c http.extraheader="$header" fetch --no-tags --prune --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "fetch failed" }
          git checkout -q --force --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "checkout failed" }
          git clean -xdf
          Write-Host ("checked out " + (git rev-parse HEAD))
      - uses: actions/checkout@v4
        if: runner.environment != 'self-hosted'

      # Only the hosted leg provisions a Python: setup-python writes HKLM
      # registry entries the self-hosted runner's non-admin service account
      # cannot, and that account stays unprivileged on purpose.
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: NT-Analyzer/requirements.txt
      - name: Verify the pre-installed toolchain
        if: runner.environment == 'self-hosted'
        # See ci.yml: pwsh is a per-user MSIX package here and unavailable to
        # the runner service account.
        shell: powershell
        run: |
          $py = (python --version)
          Write-Host $py
          if ($py -notmatch '^Python 3\.12\.') { throw "Expected Python 3.12.x, got '$py'." }
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -B -m pytest -q -p no:cacheprovider
