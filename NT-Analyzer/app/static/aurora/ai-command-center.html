<body data-page="ai" data-title="AI Центр" data-kicker="StratForge AI · Мир агентов">
<div class="ai-command-center" id="aw-center">
  <header class="aw-header">
    <div class="aw-heading">
      <div class="aw-title-row"><h1>AI Центр</h1><span class="aw-env" id="aw-context" hidden></span></div>
      <div class="aw-pulse" id="aw-pulse" aria-live="polite"><span class="aw-status aw-neutral">Загружаем состояние команды…</span></div>
    </div>
    <div class="aw-header-actions">
      <button class="btn ghost aw-diagnostics" data-aw-domain="system" title="Техническая диагностика: какие механизмы включены и отвечают">Диагностика</button>
      <button class="btn icon ghost" id="aw-refresh" aria-label="Обновить данные" title="Обновить данные">↻</button>
      <button class="btn" id="aw-run-demo" hidden>Запустить проверочные задачи</button>
      <button class="btn primary" id="aw-open-chat" title="Откроется SF Chat: опишите задачу обычным текстом">Поручить задачу</button>
    </div>
  </header>
  <div class="aw-notice" id="aw-notice" role="status" aria-live="polite" hidden></div>
  <div class="aw-navbar">
    <nav class="aw-tabs" role="tablist" aria-label="Разделы AI Центра">
      <button id="aw-tab-overview" role="tab" aria-selected="true" aria-controls="aw-content" tabindex="0" data-aw-tab="overview">Сейчас</button>
      <button id="aw-tab-work" role="tab" aria-selected="false" aria-controls="aw-content" tabindex="-1" data-aw-tab="work">Задачи</button>
      <button id="aw-tab-agents" role="tab" aria-selected="false" aria-controls="aw-content" tabindex="-1" data-aw-tab="agents">Команда</button>
    </nav>
    <nav class="aw-domain-launcher" id="aw-domain-launcher" aria-label="Инструменты AI Центра">
      <span class="aw-launcher-group" aria-label="Работа"><span class="aw-launcher-label">Работа</span><button data-aw-domain="automation">Автоматизация</button><button data-aw-domain="routines">Рутины</button><button data-aw-domain="calendar">Календарь</button><button data-aw-domain="decisions">Решения</button></span>
      <span class="aw-launcher-group" aria-label="Команда"><span class="aw-launcher-label">Команда</span><button data-aw-domain="personas">Персоны</button><button data-aw-domain="models">Модели</button><button data-aw-domain="external_agents">Внешние агенты</button><button data-aw-domain="experiments">Сравнение</button></span>
      <span class="aw-launcher-group" aria-label="Знания"><span class="aw-launcher-label">Знания</span><button data-aw-domain="memory">Память</button><button data-aw-domain="projects">Проекты</button><button data-aw-domain="publications">Публикации</button></span>
    </nav>
  </div>
  <div id="aw-content" class="aw-content" role="tabpanel" aria-labelledby="aw-tab-overview" aria-busy="true" tabindex="0">
    <div class="aw-skeleton-page" aria-label="Загрузка AI Центра"><div class="aw-skeleton aw-skeleton-strip"></div><div class="aw-skeleton-grid"><div class="aw-skeleton"></div><div class="aw-skeleton"></div><div class="aw-skeleton"></div></div></div>
  </div>
  <footer class="aw-footer"><span>Все действия проверяет сервер: персона не расширяет права, а решения не исполняют сделки.</span><span id="aw-updated"></span></footer>
</div>
