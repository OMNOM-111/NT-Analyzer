<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self' blob:; base-uri 'none'; form-action 'self'; object-src 'none'">
<title>Рабочий стол — StratForge AI</title>
<link rel="stylesheet" href="assets/theme.css?v=20260718-contours2">
<link rel="icon" href="brand/stratforge-icon.ico" sizes="any">
<style>
  /* ===================== Рабочий стол (desktop) ===================== */
  .content:has(.dsk){padding:0;gap:0}
  body[data-page="desktop"] .tb-title{height:42px;justify-content:center;overflow:hidden}
  body[data-page="desktop"] .tb-kicker,body[data-page="desktop"] .tb-h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dsk{flex:1;min-height:560px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .main.workspace-focus{width:100vw;height:100vh;min-height:100vh;background:var(--bg-1)}
  .dsk-md-offline-banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
    padding:10px 14px;margin:0;border-bottom:1px solid rgba(255,80,80,.45);
    background:linear-gradient(90deg,rgba(120,20,20,.92),rgba(60,10,10,.88));
    color:#ffe8e8;font-size:12.5px;line-height:1.35;z-index:50;position:sticky;top:0}
  .dsk-md-offline-banner[hidden]{display:none!important}
  .dsk-md-offline-banner strong{font-size:13px;letter-spacing:.02em;color:#fff}
  .dsk-md-offline-banner span{opacity:.92;color:#ffd0d0}
  .dwin-src.err .dot{background:#ff5a5a!important;box-shadow:0 0 0 2px rgba(255,90,90,.25)}
  .dwin-src.wait .dot{background:#f0c040!important}

  .dsk-focus-exit{display:none;position:absolute;right:12px;top:12px;z-index:100;width:34px;height:34px;border-radius:9px;
    border:1px solid rgba(255,255,255,.18);background:rgba(11,16,24,.78);color:var(--tx);cursor:pointer;font-size:18px;backdrop-filter:blur(8px)}
  .dsk.focus-mode .dsk-focus-exit{display:block}
  .main.workspace-focus .topbar{display:flex;height:34px;min-height:34px;padding:0 12px;background:var(--bg-1)}
  .main.workspace-focus .topbar>*:not(.tb-right),.main.workspace-focus .tb-right>*:not(.tb-datetime){display:none!important}
  .main.workspace-focus .tb-right{display:flex!important;margin-left:auto}.main.workspace-focus .tb-datetime{display:flex!important;flex-direction:row;gap:10px}
  .main.workspace-focus .global-news-strip{order:-1;display:flex!important;position:relative;top:auto;left:0;right:0;width:100%}
  .main.workspace-focus .content{flex:1;min-height:0}.main.workspace-focus .dsk{min-height:0}
  body.dsk-focus-fallback .rail{display:none!important}
  body.dsk-focus-fallback .app{grid-template-columns:1fr} body.dsk-focus-fallback .main,body.dsk-focus-fallback .content{height:100vh;min-height:0}

  /* toolbar */
  .dsk-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);
    background:var(--bg-2);flex-wrap:wrap;position:relative;z-index:6}
  .dsk-bar .sep{width:1px;height:22px;background:var(--line-2);margin:0 4px}
  .dsk-bar .spacer{flex:1}
  .dsk-bar .grp{display:flex;align-items:center;gap:4px}
  .dsk-scale{display:flex;align-items:center;gap:2px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:8px;padding:2px}
  .dsk-scale button{background:none;border:0;color:var(--tx-2);cursor:pointer;width:26px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .dsk-scale button:hover{background:var(--bg-4,rgba(255,255,255,.06));color:var(--tx)}
  .dsk-scale .zval{min-width:46px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;color:var(--tx);cursor:pointer;user-select:none}
  .dsk-res{font-size:12px;padding:5px 9px}
  .dsk-layout-name{font-weight:600;font-size:12.5px;color:var(--tx);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dsk-dirty{color:var(--warn);font-size:11px;margin-left:4px}

  /* viewport (scroll container) + virtual canvas */
  .dsk-viewport{flex:1;min-height:0;position:relative;overflow:auto;background:
     radial-gradient(circle at 20% 12%, rgba(79,209,224,.05), transparent 42%),
     radial-gradient(circle at 82% 82%, rgba(180,140,255,.05), transparent 46%),
     var(--bg-1,#0b1018)}
  .dsk-canvas-wrap{position:relative}
  .dsk-canvas{position:absolute;top:0;left:0;transform-origin:0 0;background-image:
     linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
     linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
     background-size:40px 40px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}

  .dsk-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
     gap:14px;text-align:center;color:var(--tx-2);pointer-events:none;padding:24px}
  .dsk-empty svg{width:56px;height:56px;stroke:var(--tx-3);fill:none;stroke-width:1.4;opacity:.7}
  .dsk-empty h3{margin:0;font-size:16px;color:var(--tx)}
  .dsk-empty p{margin:0;max-width:420px;font-size:12.5px;line-height:1.6}
  .dsk-empty .btn{pointer-events:auto;margin-top:4px}

  /* window */
  .dwin{position:absolute;display:flex;flex-direction:column;background:var(--panel,var(--bg-2));
     border:1px solid var(--line-2);border-radius:10px;overflow:hidden;
     box-shadow:0 10px 40px rgba(0,0,0,.45);min-width:220px;min-height:120px}
  .dwin.active{border-color:rgba(79,209,224,.55);box-shadow:0 14px 52px rgba(0,0,0,.55),0 0 0 1px rgba(79,209,224,.35)}
  .dwin.pinned{border-color:rgba(252,197,90,.6)}
  .dwin.maximized{border-radius:0}
  .dwin.minimized{height:auto!important;min-height:0}
  .dwin.minimized .dwin-body,.dwin.minimized .dwin-grip{display:none}
  .dwin.bare{border-color:transparent;border-radius:0;box-shadow:none;background:transparent}
  .dwin.bare.active{border-color:transparent;box-shadow:none}
  .dwin.bare .dwin-head{display:none}
  .dwin-bare-exit{display:none;position:absolute;z-index:7;left:7px;top:7px;width:27px;height:27px;border:1px solid rgba(255,255,255,.1);border-radius:7px;background:rgba(11,16,24,.72);color:var(--tx-2);cursor:pointer;opacity:0;transition:opacity .15s}
  .dwin-bare-exit svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
  .dwin.bare .dwin-bare-exit{display:flex;align-items:center;justify-content:center}.dwin.bare:hover .dwin-bare-exit{opacity:1}

  .dwin-head{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 10px;
     background:linear-gradient(180deg, var(--bg-3), var(--bg-2));border-bottom:1px solid var(--line);cursor:move;user-select:none;flex:0 0 auto}
  .dwin.pinned .dwin-head{cursor:default}
  .dwin-sym{font-weight:750;font-size:13px;color:var(--tx);white-space:nowrap}
  .dwin-tf{font-size:11px;color:var(--tx-2);background:var(--bg-4,rgba(255,255,255,.06));padding:1px 6px;border-radius:5px}
  .dwin-meta{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
  .dwin-src{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--tx-3);white-space:nowrap}
  .dwin-src .dot{width:6px;height:6px;border-radius:50%;background:var(--tx-3)}
  .dwin-src.live .dot{background:var(--pos);box-shadow:0 0 6px var(--pos)}
  .dwin-src.wait .dot{background:var(--warn)}
  .dwin-src.err .dot{background:var(--neg)}
  .dwin-ctl{margin-left:auto;display:flex;align-items:center;gap:1px}
  .dwin-ctl button{background:none;border:0;color:var(--tx-2);cursor:pointer;width:26px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}
  .dwin-ctl button:hover{background:rgba(255,255,255,.08);color:var(--tx)}
  .dwin-ctl button.on{color:var(--warn)}
  .dwin-ctl button.close:hover{background:rgba(255,107,129,.2);color:var(--neg)}
  .dwin-ctl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  .dwin-body{flex:1;min-height:0;position:relative}
  .dwin-chart{position:absolute;inset:0}
  .dwin-tools{position:absolute;z-index:5;right:7px;top:7px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;opacity:.5;transition:opacity .15s}
  .dwin:hover .dwin-tools,.dwin-tools:focus-within,.dwin-tools.open{opacity:1}
  .dwin-tools-btn{width:28px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.1);background:rgba(11,16,24,.78);color:var(--tx-2);cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
  .dwin-tools-btn:hover,.dwin-tools.open .dwin-tools-btn{background:rgba(79,209,224,.16);color:var(--info);border-color:rgba(79,209,224,.4)}
  .dwin-tools-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .dwin-tools-menu{display:none;flex-direction:column;min-width:190px;padding:5px;border-radius:9px;background:rgba(12,18,29,.97);border:1px solid var(--line-3);box-shadow:0 12px 40px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
  .dwin-tools-menu.open{display:flex}
  .dwin-tools-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;border-radius:6px;background:transparent;color:var(--tx);font-size:12px;cursor:pointer;text-align:left}
  .dwin-tools-menu button:hover,.dwin-tools-menu button.on{background:rgba(79,209,224,.14);color:var(--info)}
  .dwin-tools-menu .dt-ic{width:18px;text-align:center;font-size:13px;color:var(--tx-2)}
  .dwin-tools-menu button.on .dt-ic{color:var(--info)}

  /* in-chart hidden side menu (left edge) — instrument, timeframe, indicators */
  .dwin-side{position:absolute;z-index:6;left:0;right:0;top:0;bottom:0;display:flex;align-items:stretch;pointer-events:none}
  .dwin-side-tab{pointer-events:auto;align-self:center;width:15px;height:54px;margin-left:0;border-radius:0 8px 8px 0;
    background:rgba(11,16,24,.72);border:1px solid rgba(255,255,255,.1);border-left:0;color:var(--tx-3);
    display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.4;transition:opacity .15s}
  .dwin:hover .dwin-side-tab{opacity:.85}
  .dwin-side-tab svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
  .dwin-side-panel{pointer-events:auto;position:absolute;left:0;top:8px;width:min(232px,calc(100% - 16px));max-height:calc(100% - 16px);overflow:auto;
    display:none;flex-direction:column;gap:8px;padding:10px;border-radius:0 11px 11px 0;
    background:rgba(12,18,29,.97);border:1px solid var(--line-3);border-left:0;box-shadow:0 14px 44px rgba(0,0,0,.55);backdrop-filter:blur(10px)}
  .dwin-side.open .dwin-side-panel{display:flex}
  .dwin-side.open .dwin-side-tab{opacity:1;color:var(--info)}
  .dsd-inst{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .dsd-inst b{font-size:13px;color:var(--tx)}
  .dsd-link{border:0;background:none;color:var(--info);font-size:11px;cursor:pointer;padding:0}
  .dsd-cap{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx-3);margin-top:2px}
  .dsd-row{display:flex;flex-wrap:wrap;gap:4px}
  .dsd-row button,.dsd-inds button{font:inherit;font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--tx-2);cursor:pointer}
  .dsd-row button.on,.dsd-inds button.on{background:rgba(79,209,224,.16);border-color:rgba(79,209,224,.5);color:var(--info)}
  .dsd-inds{display:flex;flex-wrap:wrap;gap:4px}
  .dwin-side-panel .btn.sm{width:100%;justify-content:center;margin-top:2px}
  .macd-fields{display:none;flex-direction:column;gap:10px}.macd-fields.show{display:flex}
  .macd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dwin-alert{display:none;position:absolute;left:8px;right:8px;top:8px;z-index:5;padding:8px 10px;border-radius:8px;
    background:rgba(255,107,129,.16);border:1px solid rgba(255,107,129,.55);color:#ffd5dc;font-size:11px;font-weight:650;pointer-events:none}
  .dwin-alert.show{display:block;animation:dwin-alert-in .25s ease-out}
  .dwin-drawing-editor{display:none;position:absolute;z-index:8;right:7px;top:40px;width:min(290px,calc(100% - 14px));max-height:calc(100% - 48px);overflow:auto;
    padding:10px;border-radius:10px;background:rgba(12,18,29,.96);border:1px solid var(--line-3);box-shadow:0 14px 44px rgba(0,0,0,.55);backdrop-filter:blur(10px)}
  .dwin-drawing-editor.show{display:block}
  .dwin-drawing-editor.collapsed{max-height:38px!important;overflow:hidden!important;padding:0!important;width:auto!important;min-width:130px}
  .dwin-drawing-editor.collapsed .drawing-edit-form>*:not(.drawing-edit-head){display:none}
  .dwin-drawing-editor.collapsed .draw-settings-body{display:none}
  .dwin-drawing-editor.collapsed .drawing-edit-head{padding:8px 10px;margin:0}
  .drawing-edit-form{display:flex;flex-direction:column;gap:8px;font-size:11px}.drawing-edit-form label{display:flex;flex-direction:column;gap:3px;color:var(--tx-2)}
  .drawing-edit-form input,.drawing-edit-form select,.drawing-edit-form textarea{font:inherit;color:var(--tx);background:var(--bg-2);border:1px solid var(--line-2);border-radius:6px;padding:6px 7px;resize:vertical}
  .drawing-edit-head,.drawing-edit-row,.drawing-edit-actions{display:flex;align-items:center;gap:7px}.drawing-edit-head b{flex:1;color:var(--tx)}
  .drawing-edit-head button{border:0;background:none;color:var(--tx-2);font-size:18px;cursor:pointer}.drawing-edit-row>*{flex:1}.drawing-edit-actions{justify-content:space-between;margin-top:3px}
  .drawing-lock{flex-direction:row!important;align-items:center}.drawing-agent-fields{display:none;flex-direction:column;gap:7px}.drawing-agent-fields.show{display:flex}
  .drawing-report-field{display:none!important}.drawing-report-field.show{display:flex!important}
  .draw-settings-body{display:flex;flex-direction:column;gap:8px}
  .draw-dur-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .draw-dur-presets{display:flex;gap:3px;flex-wrap:wrap}
  .draw-dur-presets.hidden,.draw-dur-custom.hidden{display:none!important}
  .draw-dur-custom{width:72px;font:inherit;font-size:11px;padding:4px 6px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:6px;color:var(--tx)}
  .tf-seg-btn{font:inherit;font-size:11px;padding:4px 7px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--tx-2);cursor:pointer}
  .tf-seg-btn.on{background:rgba(79,209,224,.16);border-color:rgba(79,209,224,.5);color:var(--info)}
  @keyframes dwin-alert-in{from{transform:translateY(-5px);opacity:0}to{transform:none;opacity:1}}

  /* resize handles — wider touch zone, visible on hover */
  .dwin-grip{position:absolute;z-index:3}
  .dwin-grip[data-dir="e"]{top:8px;right:-4px;bottom:8px;width:10px;cursor:ew-resize}
  .dwin-grip[data-dir="w"]{top:8px;left:-4px;bottom:8px;width:10px;cursor:ew-resize}
  .dwin-grip[data-dir="s"]{left:8px;right:8px;bottom:-4px;height:10px;cursor:ns-resize}
  .dwin-grip[data-dir="n"]{left:8px;right:8px;top:-4px;height:10px;cursor:ns-resize}
  .dwin-grip[data-dir="se"]{right:-4px;bottom:-4px;width:20px;height:20px;cursor:nwse-resize}
  .dwin-grip[data-dir="sw"]{left:-4px;bottom:-4px;width:20px;height:20px;cursor:nesw-resize}
  .dwin-grip[data-dir="ne"]{right:-4px;top:-4px;width:20px;height:20px;cursor:nesw-resize}
  .dwin-grip[data-dir="nw"]{left:-4px;top:-4px;width:20px;height:20px;cursor:nwse-resize}
  /* SE corner chevron indicator */
  .dwin-grip[data-dir="se"]::after{content:"";position:absolute;right:4px;bottom:4px;width:9px;height:9px;
     border-right:2px solid rgba(255,255,255,.35);border-bottom:2px solid rgba(255,255,255,.35);border-bottom-right-radius:3px;opacity:.7}
  .dwin-grip[data-dir="se"]:hover::after{border-color:rgba(79,209,224,.9);opacity:1}
  /* Side/top/bottom grips: subtle highlight strip on hover */
  .dwin-grip[data-dir="e"]:hover,.dwin-grip[data-dir="w"]:hover{background:linear-gradient(90deg,transparent,rgba(79,209,224,.2),transparent);border-radius:2px}
  .dwin-grip[data-dir="s"]:hover,.dwin-grip[data-dir="n"]:hover{background:linear-gradient(180deg,transparent,rgba(79,209,224,.2),transparent);border-radius:2px}
  .dwin.pinned .dwin-grip,.dwin.maximized .dwin-grip{display:none}

  /* ChartEngine skin */
  .ce-host{position:absolute;inset:0;overflow:hidden;background:var(--bg-1,#0b1018)}
  .ce-canvas{display:block;cursor:crosshair}
  .ce-host.ce-grabbing .ce-canvas{cursor:grabbing}
  .ce-host.ce-drawing .ce-canvas{cursor:cell}
  .ce-legend{position:absolute;top:6px;left:8px;display:none;align-items:center;gap:7px;font-size:11px;
     pointer-events:none;background:rgba(11,16,24,.55);padding:3px 8px;border-radius:6px;backdrop-filter:blur(4px);max-width:calc(100% - 16px);overflow:hidden;white-space:nowrap}
  .ce-legend.show{display:flex}
  .ce-legend .ce-sym{font-weight:750;color:var(--tx)}
  .ce-legend .ce-tf{color:var(--tx-2);background:rgba(255,255,255,.08);padding:0 5px;border-radius:4px}
  .ce-legend .ce-ohlc{color:var(--tx-2)}
  .ce-legend .ce-k{color:var(--tx-3);margin-left:5px;margin-right:2px}
  .ce-empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx-3);pointer-events:none}
  .ce-empty.show{display:flex}
  .ce-empty-mark{width:26px;height:26px;border-radius:50%;border:2px solid var(--warn);border-top-color:transparent;animation:ce-spin 1s linear infinite}
  .ce-empty-tx{font-size:12px}
  .ce-loading{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:9px;
     color:var(--tx-2);pointer-events:none;background:rgba(11,16,24,.42);backdrop-filter:blur(1px);z-index:3}
  .ce-loading.show{display:flex}
  @keyframes ce-spin{to{transform:rotate(360deg)}}

  /* minimized dock (taskbar for minimized windows) */
  .dsk-dock{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:6px 10px;flex-wrap:wrap;
     background:linear-gradient(0deg, var(--bg-2), transparent);pointer-events:none;z-index:5}
  .dsk-dock:empty{display:none}
  .dsk-dock .dock-item{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:var(--bg-3);
     border:1px solid var(--line-2);border-radius:8px;padding:4px 8px;font-size:11.5px;color:var(--tx);cursor:pointer}
  .dsk-dock .dock-item:hover{border-color:rgba(79,209,224,.5)}
  .dsk-dock .dock-item .dot{width:6px;height:6px;border-radius:50%;background:var(--pos)}

  /* add-chart dialog form (compact density) */
  .dchart-form{display:flex;flex-direction:column;gap:11px}
  .dchart-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:14px;align-items:start}
  .dchart-settings{display:flex;flex-direction:column;gap:9px;min-width:0}
  .dchart-preview-wrap{position:sticky;top:0;display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg-2)}
  .dchart-preview-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.dchart-preview-title span{font-size:10.5px;color:var(--tx-3)}
  .dchart-preview{position:relative;height:280px;overflow:hidden;border:1px solid var(--line);border-radius:9px}
  .dchart-form .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .dchart-form label{display:flex;flex-direction:column;gap:3px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx-2)}
  .dchart-form .dchart-field{display:flex;flex-direction:column;gap:6px}
  .dchart-form .dchart-cap{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx-2)}
  .dchart-form .ind-chip{text-transform:none;letter-spacing:0;flex-direction:row;font-size:11.5px}
  .dchart-form select,.dchart-form input{font:inherit;font-size:12px;padding:6px 8px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:7px;color:var(--tx);text-transform:none;letter-spacing:0}
  .dchart-form input[type="color"]{padding:2px;height:28px;width:100%}
  .style-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
