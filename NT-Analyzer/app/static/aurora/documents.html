<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:*; media-src 'self' blob:; base-uri 'none'; form-action 'self'; object-src 'none'">
<title>Документы — StratForge AI</title>
<link rel="stylesheet" href="assets/theme.css?v=20260812-phase12-owner1">
<link rel="icon" href="brand/stratforge-icon.ico" sizes="any">
<style>
  .docs-grid { display:grid; grid-template-columns:280px minmax(0,1fr); gap:18px; align-items:start; }
  .docs-grid.docs-privileged:not(.docs-journal-hidden) { grid-template-columns:280px minmax(0,1fr) 300px; }
  @media (max-width: 1200px){ .docs-grid, .docs-grid.docs-privileged:not(.docs-journal-hidden) { grid-template-columns:260px minmax(0,1fr); } .docs-hist { display:none; } }
  @media (max-width: 860px){ .docs-grid, .docs-grid.docs-privileged:not(.docs-journal-hidden) { grid-template-columns:minmax(0,1fr); } .docs-grid > aside { position:static !important; } }
  .doc-info { margin-top:22px; border:1px solid var(--line); border-radius:10px; background:var(--bg-1); }
  .doc-info > summary { cursor:pointer; padding:10px 14px; font-size:12.5px; color:var(--tx-2); list-style:none; user-select:none; }
  .doc-info > summary::-webkit-details-marker { display:none; }
  .doc-info > summary::before { content:'▸ '; color:var(--tx-3); }
  .doc-info[open] > summary::before { content:'▾ '; }
  .doc-info-body { padding:4px 14px 14px; font-size:12.5px; color:var(--tx-2); }
  .doc-info-body .kv { display:flex; gap:8px; padding:3px 0; }
  .doc-info-body .kv b { min-width:120px; color:var(--tx-3); font-weight:600; }
  .doc-info-body .kv code { word-break:break-all; }
  .rev-item { border-left:2px solid var(--line); padding:6px 0 12px 12px; margin-left:4px; }
  .rev-item .rev-head { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .rev-no { font-weight:700; }
  .rev-date { margin-left:auto; font-size:10.5px; color:var(--tx-3); }
  .rev-ver { font-family:var(--mono); font-size:10.5px; color:var(--tx-3); }
  .rev-meta { font-size:11.5px; color:var(--tx-2); margin:2px 0; }
  .rev-meta .rev-init { color:var(--tx-3); }
  .rev-reason { font-size:11.5px; color:var(--tx-1); margin:2px 0 6px; }
  .rev-created { padding:6px 8px; border-radius:7px; background:var(--bg-2); color:var(--tx-2); font-size:11.5px; }
  .rev-summary { display:grid; gap:4px; margin:6px 0; padding:7px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg-1); font-size:11.5px; line-height:1.35; }
  .rev-summary-label { color:var(--tx-3); font-weight:600; }
  .rev-summary del { color:#e06666; text-decoration-thickness:1.5px; }
  .rev-summary ins { color:#2ecc71; text-decoration:none; font-weight:600; }
  .rev-details { margin-top:5px; }
  .rev-tech { display:grid; gap:3px; padding:6px 0; color:var(--tx-3); font-size:10.5px; }
  .rev-tech code { word-break:break-all; }
  .rev-diff { font-family:var(--mono); font-size:11px; line-height:1.45; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .rev-diff .dl { display:block; padding:1px 8px; white-space:pre-wrap; word-break:break-word; }
  .rev-diff .dl.add { background:rgba(34,180,90,0.14); color:#2ecc71; }
  .rev-diff .dl.del { background:rgba(220,60,60,0.14); color:#e06666; text-decoration:line-through; }
  .rev-diff .dl.ctx { color:var(--tx-3); }
  .rev-diff-toggle { font-size:11px; color:var(--ac); cursor:pointer; user-select:none; }
</style>
</head>
<body data-page="docs" data-title="Документы и законы" data-kicker="StratForge AI · Управление и законы">

  <div class="notice info" id="owner-banner" hidden style="margin-bottom:18px"><strong>Владелец проекта:</strong> <span id="project-owner">Черевко Дмитро</span></div>

  <div class="docs-grid">
    <!-- list -->
    <aside class="panel" style="position:sticky; top:78px;">
      <div class="panel-b" style="padding:12px;">
        <label class="tb-search" style="width:100%; margin:0;">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input type="search" id="doc-search" placeholder="Поиск по документам…">
        </label>
      </div>
      <div class="list" id="doc-list"></div>
    </aside>

    <!-- viewer -->
    <section class="panel">
      <div class="panel-h">
        <h2 id="doc-cat">—</h2><span class="sub" id="doc-meta"></span>
        <div class="spacer"></div>
        <button class="btn sm ghost" id="journal-toggle" hidden>Журнал редакций</button>
        <button class="btn sm" id="edit-btn">Редактировать</button>
      </div>
      <div class="panel-b">
        <article class="doc" id="doc-view"></article>
        <details class="doc-info" id="doc-info" hidden>
          <summary>Сведения о документе</summary>
          <div class="doc-info-body" id="doc-info-body"></div>
        </details>
        <div id="doc-edit" hidden class="col gap-lg">
          <div class="field"><label for="edit-area">Содержимое (markdown)</label><textarea id="edit-area" style="min-height:340px; font-family:var(--mono); font-size:12.5px"></textarea></div>
          <div class="field"><label for="edit-reason">Основание правки *</label><input id="edit-reason" placeholder="например: уточнение лимита риска"></div>
          <div class="sub" id="edit-author-hint" style="color:var(--tx-3)"></div>
          <div class="flex gap-sm"><button class="btn primary" id="save-btn">Сохранить правку</button><button class="btn ghost" id="cancel-btn">Отмена</button><span class="sub" id="edit-status"></span></div>
        </div>
      </div>
    </section>

    <!-- revision journal -->
    <aside class="panel docs-hist" id="hist-panel" hidden style="position:sticky; top:78px;">
      <div class="panel-h"><h2>Журнал редакций</h2><span class="sub" id="hist-scope"></span></div>
      <div class="panel-b"><div class="timeline" id="history"></div></div>
      <div class="panel-h" style="border-top:1px solid var(--line); border-bottom:none"><h2>Действующие параметры</h2></div>
      <div class="panel-b col gap-sm" id="runtime-defaults"></div>
    </aside>
  </div>

<script src="assets/api.js?v=20260812-final-acceptance2"></script>
<script src="assets/domain.js?v=20260629-final4"></script>
<script src="assets/ambient.js?v=20260703-stratforge1"></script>
<script src="assets/ui.js?v=20260812-final-acceptance2"></script>
<script src="assets/victor.js?v=20260718-contours2"></script>
<script src="assets/pages/documents.js?v=20260812-final-acceptance1"></script>
</body>
</html>
